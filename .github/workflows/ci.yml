name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_live:
        description: Run controlled provider live acceptance
        required: false
        type: boolean
        default: false
      run_soak:
        description: Run native runtime soak
        required: false
        type: boolean
        default: false

jobs:
  quality-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install development tools
        run: python -m pip install -e ".[dev]"
      - name: Quality gate
        run: python scripts/run_ci.py --profile quality

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Native Windows acceptance
        run: python scripts/run_ci.py --profile test

  test-macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Native macOS acceptance
        run: python scripts/run_ci.py --profile test

  live-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: windows-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
      LITMINER_CONTACT_EMAIL: ${{ secrets.LITMINER_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .
      - name: Release provider gate
        run: python scripts/run_ci.py --profile live --provider-profile release

  live-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live
    runs-on: macos-latest
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      OPENALEX_MAILTO: ${{ secrets.OPENALEX_MAILTO }}
      CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      UNPAYWALL_EMAIL: ${{ secrets.UNPAYWALL_EMAIL }}
      LITMINER_CONTACT_EMAIL: ${{ secrets.LITMINER_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .
      - name: Release provider gate
        run: python scripts/run_ci.py --profile live --provider-profile release

  soak-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .
      - name: Standard Windows soak
        run: python scripts/run_ci.py --profile soak --soak-profile standard

  soak-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.run_soak
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install -e .
      - name: Quick macOS soak
        run: python scripts/run_ci.py --profile soak --soak-profile quick
